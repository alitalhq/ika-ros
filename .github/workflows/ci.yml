name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: src/ika
      - name: Bağımlılıklar
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src -y \
            -t build -t buildtool -t build_export -t buildtool_export -t test
          apt-get install -y python3-flake8 shellcheck
      - name: flake8
        run: python3 -m flake8 --config src/ika/.flake8 src/ika/src
      - name: shellcheck
        run: shellcheck -e SC1091 src/ika/deploy/*.sh src/ika/docker/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web calibration tests
        run: node --test src/ika/src/ika_gcs/test/*.test.cjs
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths src/ika/src --event-handlers console_cohesion-
      - name: Test
        run: |
          source install/setup.bash
          colcon test --base-paths src/ika/src --event-handlers console_cohesion-
          colcon test-result --verbose
