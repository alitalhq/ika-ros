# Robotun TÜM donanım bağlantıları bu dosyada (pin tablosu: docs/donanim.md).
#
# Pin  : Gemstone hat adı ("GPIO22") ya da "gpiochipN:line".
# PWM  : modül adı ("ecap0", "epwm1:1"); pwmchip numaraları overlay'lere göre
#        değiştiği için numara yerine modül adı kullanın.
# İlk iş: `ros2 run ika_base hw_check pins --config <bu dosya>` her pini çözüp listeler.
#
# ROS 2 kuralı: float parametrelere ondalıklı değer yazın (1 değil 1.0).

ika_base_node:
  ros__parameters:
    motor_driver: in_in_pwm          # L298N: IN1/IN2 yön, ENA/ENB PWM (jumper'lar çıkarılmış)
    brake_on_stop: false
    pwm_period_ns: 1000000           # 1 kHz; ENB'nin epwm1 kanalı GPIO6 ile periyot paylaşır

    # Sol/sağ robotun arkasından, çizgi sensörüne (öne) bakarak. Bu robotta
    # L298N'nin Motor 1 çıkışı (OUT1/OUT2) SAĞ tekere, Motor 2 çıkışı
    # (OUT3/OUT4) SOL tekere bağlı; hw_check motors ile doğrulandı.
    left:                            # Motor 2 (L298N OUT3/OUT4) -> sol teker
      in1: "GPIO24"                  # pin 18 -> IN3
      in2: "GPIO25"                  # pin 22 -> IN4
      pwm: "epwm1:1"                 # GPIO13, pin 33 -> ENB
      invert: true                   # aynalı montaj: bu motor ters yönde sarılı
      enc_a: "GPIO27"                # pin 13 <- Motor 2 enkoder C1
      enc_b: "GPIO23"                # pin 16 <- Motor 2 enkoder C2
      enc_invert: true
    right:                           # Motor 1 (L298N OUT1/OUT2) -> sağ teker
      in1: "GPIO22"                  # pin 15 -> IN1
      in2: "GPIO17"                  # pin 11 -> IN2
      pwm: "ecap0"                   # GPIO12, pin 32 -> ENA
      invert: false
      enc_a: "GPIO4"                 # pin 7  <- Motor 1 enkoder C1
      enc_b: "GPIO5"                 # pin 29 <- Motor 1 enkoder C2
      enc_invert: false

    encoder:
      mode: x4
      bias: as-is                    # enkoder kartında dahili pull-up var
      ppr: 546.0                     # Waveshare DCGM-3865: 13 PPR x 1:42, çıkış milinde

    max_wheel_speed: 0.8             # %100 duty'de teker hızı [m/s]; tahmin: ~180 rpm x 85 mm.
                                     # hw_check sweep ile ölçün
    max_accel: 0.6                   # kalkış/duruş ivmesi [m/s^2]; 1.0 sert hissediliyordu
    control_rate: 50.0
    cmd_timeout: 0.5
    speed_filter_alpha: 0.5
    pid:
      kp: 60.0
      ki: 300.0
      kff: 1.0
      min_duty: 0.0                  # tekerin kalktığı duty — hw_check sweep
      max_duty: 100.0
      i_limit: 30.0                  # integral katkısı sınırı [%]; ölçüm düşünce %100'e kilitlenmesin

line_sensor_node:
  ros__parameters:
    # Kitteki sensör: "8路寻线模块" (8 kanallı, Pololu QTR-8 benzeri klon).
    # Her kanal 10 kΩ ile VCC'ye çekili analog çıkış: beyaz ≈ 0 V, siyah ≈ VCC;
    # GPIO eşiğiyle dijital okunur. Kartı yalnızca 3.3 V ile besleyin ve
    # "3.3V" köprüsünü lehimleyin (docs/donanim.md). Pololu QTR-8RC için: type: qtr_rc
    type: digital
    # Soldan sağa (robotun arkasından, ileri bakarak) D1 ... D8.
    pins: ["GPIO21",                 # pin 40 <- D1
           "GPIO6",                  # pin 31 <- D2
           "GPIO19",                 # pin 35 <- D3
           "GPIO26",                 # pin 37 <- D4
           "GPIO16",                 # pin 36 <- D5
           "GPIO20",                 # pin 38 <- D6
           "GPIO8",                  # pin 24 <- D7
           "GPIO7"]                  # pin 26 <- D8
    emitter_pin: ""                  # IR (LED) pini boşta: kartta LED'ler açık
    spacing: 0.009525                # kanal aralığı (9.525 mm)
    rate: 100.0
    line_is_dark: true               # beyaz zeminde siyah çizgi
    digital:
      line_level: 1                  # siyah çizgi üstünde okunan seviye
      bias: as-is                    # Gemstone pad'lerinde iç direnç yazılımdan açılamıyor
    qtr:                             # yalnızca type: qtr_rc
      threshold_us: 1000
      timeout_us: 2500
      charge_us: 10

ika_imu_node:
  ros__parameters:
    spi_device: /dev/spidev0.3       # Gemstone dahili ICM-20948
    rate: 100.0
    calibration_samples: 300         # açılışta ~1.5 sn robotu oynatmayın

lidar_manager_node:
  ros__parameters:
    # usb : lidarın kendi USB adaptörü (varsayılan); motoru adaptör sürer
    # gpio: adaptörsüz, Gemstone UART'ı + motor PWM'i (docs/donanim.md)
    # Arayüzdeki Lidar panelinden değiştirilince seçim state_file'a kaydedilir
    # ve buradaki değerin önüne geçer.
    source: usb
    state_file: ~/.ika/lidar_source
    baudrate: 115200                 # A1
    frame_id: lidar_link
    inverted: false
    angle_compensate: true
    usb:
      port: ""                       # boş: /dev/serial/by-id altındaki CP210x, yoksa /dev/ttyUSB*
    gpio:
      port: /dev/ttyS3               # UART-MAIN1: Gemstone TX GPIO14 (pin 8), RX GPIO15 (pin 10)
      pwm: "ecap2"                   # GPIO18, pin 12 -> lidar MOTOCTL
      period_ns: 1000000
      duty_percent: 85.0             # %100'de motor gürültüsü UART'ı bozuyordu (eski robot)
