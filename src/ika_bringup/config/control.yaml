mode_manager_node:
  ros__parameters:
    rate: 20.0
    cmd_timeout: 0.5
    teleop_takeover: true            # başka moddayken teleop -> manual
    safety:
      # Kapalı: sahada manuel sürüşü kilitliyordu. Otonom sürüşte açmak için true.
      enabled: false
      # Engel, robotun gideceği koridorda (gövde genişliği + side_margin)
      # aranır; mesafeler gövdenin ön (geri giderken arka) ucundan [m].
      # Gövde ölçüleri robot.yaml'dan gelir.
      stop_distance: 0.10
      slow_distance: 0.35
      side_margin: 0.01              # gövde kenarından pay; köşeler sürtüyorsa artırın
      scan_timeout: 0.5

line_follower_node:
  ros__parameters:
    # Değerler 8 kanallı analog konumla (Deneyap) benzetimde ayarlandı:
    # eski 0.15 m/s / kp 12 ayarı virajda ~45 mm sapıp salınıyordu (#27).
    speed: 0.30
    kp: 50.0                         # [rad/s / m]
    kd: 8.0
    d_filter: 0.5                    # türevi alçak geçirgenle yumuşatır (0 = kapalı)
    max_angular: 4.0
    min_speed_ratio: 0.4             # en keskin hatada hızın kalacağı oran
    half_width: 0.025                # bu hatada hız min_speed_ratio'ya iner
    search_angular: 1.2
    lost_timeout: 3.0
    intersection_action: straight    # straight | stop

map_manager_node:
  ros__parameters:
    map_dir: ~/ika_maps
