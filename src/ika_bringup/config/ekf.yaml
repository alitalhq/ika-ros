# robot_localization EKF: teker odometrisi + IMU jiroskobu -> odom->base_link.
# Tekerden ileri hız (vx) ve yanal hız (vy = 0, diferansiyel kısıt),
# dönüş hızını hem tekerden hem IMU'dan alır. IMU dönüşte kaymaya karşı
# tekerden daha güvenilir olduğu için kovaryansı daha düşüktür.

ekf_filter_node:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    #            x      y      z      roll   pitch  yaw
    #            vx     vy     vz     vroll  vpitch vyaw
    #            ax     ay     az
    odom0: /wheel/odom
    odom0_config: [false, false, false, false, false, false,
                   true,  true,  false, false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    imu0: /imu/data_raw
    imu0_config: [false, false, false, false, false, false,
                  false, false, false, false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 20
    imu0_remove_gravitational_acceleration: false
