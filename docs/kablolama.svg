<text x="1157.5" y="720" text-anchor="middle" font-weight="700" font-size="14">Bu robotta boşta / yedek bağlantılar</text>
<text x="912" y="752" text-anchor="start" font-size="11" fill="#333" font-weight="400">pin 12 · GPIO18 (ecap2) → lidar MOTOCTL — yalnız GPIO lidar</text>
<text x="912" y="774" text-anchor="start" font-size="11" fill="#333" font-weight="400">pin 18 TX / pin 26 RX (ttyS0, uart-ttys0 overlay) → lidar — yalnız GPIO lidar</text>
<text x="912" y="796" text-anchor="start" font-size="11" fill="#333" font-weight="400">pin 2, 4 · 5V → lidar V5/VMOTO — yalnız GPIO lidar</text>
<text x="912" y="818" text-anchor="start" font-size="11" fill="#333" font-weight="400">type: digital çizgi: D1…D8 → pin 40, 31, 35, 3, 36, 38, 24, 5</text>
<text x="912" y="840" text-anchor="start" font-size="11" fill="#333" font-weight="400">   (pin 3/5 için i2c1 overlay'i kapalı olmalı)</text>
<text x="912" y="862" text-anchor="start" font-size="11" fill="#333" font-weight="400">Pin 37 artık L298N IN3; eski şemadaki pin 18 lidara verildi.</text>
