<text x="30" y="924" text-anchor="start" font-size="10" fill="#555" font-weight="400">Pin numarası = Gemstone 40 pin header'daki fiziksel numara (kalın). Kesik çizgi: isteğe bağlı/önerilen.</text>
<text x="30" y="940" text-anchor="start" font-size="10" fill="#555" font-weight="400">Gemstone DC girişi: resmi 5–12 V; v0.2 şemasında eFuse ~14.7 V'ta keser, dolu 3S (12.6 V) güvenli. Pili Type-C'ye asla bağlamayın.</text>
<text x="30" y="956" text-anchor="start" font-size="10" fill="#555" font-weight="400">Bkz. docs/donanim.md (pin tablosu) ve docs/guvenlik.md (pil güvenliği).</text>
