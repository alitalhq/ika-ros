<text x="24" y="58" font-size="12.5" fill="#5d6673">Üstten görünüm. Fiziksel pin 1 sol üsttedir. Sağ ve sol, robotun arkasından önüne doğru bakıldığında belirlenir.</text>
<text x="24" y="76" font-size="12.5" fill="#5d6673">Kesikli halka: seçime bağlı bağlantı. Varsayılan düzen Deneyap Mini v2 ve USB adaptörlü lidardır.</text>
